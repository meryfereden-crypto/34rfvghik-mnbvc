<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssinia Tours - Dialogue Audio Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-amber-400 flex items-center gap-3">
                    <i class="fa-solid fa-microphone-lines"></i>
                    Abyssinia Tours Dialogue Synthesizer
                </h1>
                <p class="text-slate-400 mt-1 text-sm md:text-base">
                    British Accent Audio Synthesizer & WAV Audio Downloader
                </p>
            </div>
            <div class="flex items-center gap-2 bg-slate-900/60 px-4 py-2 rounded-lg border border-slate-700 text-xs md:text-sm">
                <i class="fa-solid fa-earth-europe text-emerald-400"></i>
                <span>Accent Target: <strong>en-GB (British)</strong></span>
            </div>
        </header>

        <!-- Controls Bar -->
        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-lg flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <button id="playBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition flex items-center gap-2 shadow-lg hover:shadow-amber-500/20">
                    <i class="fa-solid fa-play"></i> Play Dialogue
                </button>
                <button id="stopBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold px-5 py-3 rounded-xl transition flex items-center gap-2 disabled:opacity-50" disabled>
                    <i class="fa-solid fa-stop"></i> Stop
                </button>
            </div>

            <div class="flex items-center gap-3">
                <button id="exportWavBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition flex items-center gap-2 shadow-lg hover:shadow-emerald-500/20">
                    <i class="fa-solid fa-download"></i> Generate & Download WAV
                </button>
            </div>
        </div>

        <!-- Voice Settings Configurator -->
        <div class="bg-slate-800/80 rounded-xl p-5 border border-slate-700">
            <h2 class="text-lg font-semibold text-slate-200 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-amber-400"></i> Voice & Accent Configuration
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">
                        Tour Guide Voice (British Female Target)
                    </label>
                    <select id="femaleVoiceSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">
                        Tourists Voice (British Male Target)
                    </label>
                    <select id="maleVoiceSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
                    </select>
                </div>
            </div>
        </div>

        <!-- Script Viewer -->
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
            <h2 class="text-xl font-bold text-slate-200 mb-4 flex items-center justify-between">
                <span><i class="fa-solid fa-scroll text-amber-400 mr-2"></i>Dialogue Transcript</span>
                <span id="statusBadge" class="text-xs bg-slate-700 text-slate-300 font-medium px-3 py-1 rounded-full">Ready</span>
            </h2>

            <div id="dialogueList" class="space-y-3">
                <!-- Lines render dynamically -->
            </div>
        </div>

    </div>

    <script>
        const dialogueData = [
            {
                speaker: "Tour Guide",
                gender: "female",
                text: "Good morning, everyone! Welcome to Ethiopia!",
                pitch: 1.1,
                rate: 0.95
            },
            {
                speaker: "Mr. Coleman",
                gender: "male",
                text: "Good morning! It's wonderful to finally be here.",
                pitch: 0.9,
                rate: 0.95
            },
            {
                speaker: "Tour Guide",
                gender: "female",
                text: "How was the flight, Sir? How are you this evening, Mr. Karen?",
                pitch: 1.1,
                rate: 0.95
            },
            {
                speaker: "Mr. Coleman",
                gender: "male",
                text: "The flight was smooth, thank you. We're very excited for the tour.",
                pitch: 0.9,
                rate: 0.95
            },
            {
                speaker: "Mr. Karen",
                gender: "male",
                text: "I'm doing well, thank you! Just a bit tired from the trip.",
                pitch: 0.82,
                rate: 0.95
            },
            {
                speaker: "Tour Guide",
                gender: "female",
                text: "Can I help you with the luggage, Mr. John? Please, get into the bus and watch your steps as you board. Mind your head!",
                pitch: 1.1,
                rate: 0.95
            },
            {
                speaker: "Mr. John",
                gender: "male",
                text: "Thank you, that would be great. The steps are quite steep!",
                pitch: 0.95,
                rate: 0.95
            },
            {
                speaker: "Tour Guide",
                gender: "female",
                text: "Is everyone in? Great! On behalf of Abyssinia Tours, please enjoy your holiday and have a nice vacation!",
                pitch: 1.1,
                rate: 0.95
            },
            {
                speaker: "Tourists",
                gender: "male",
                text: "Thank you so much! We are looking forward to it.",
                pitch: 0.88,
                rate: 0.9
            }
        ];

        let voices = [];
        let synth = window.speechSynthesis;
        let isPlaying = false;
        let currentLineIndex = 0;

        const dialogueList = document.getElementById('dialogueList');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const exportWavBtn = document.getElementById('exportWavBtn');
        const femaleVoiceSelect = document.getElementById('femaleVoiceSelect');
        const maleVoiceSelect = document.getElementById('maleVoiceSelect');
        const statusBadge = document.getElementById('statusBadge');

        // Render UI dialogue lines
        function renderDialogue() {
            dialogueList.innerHTML = '';
            dialogueData.forEach((item, index) => {
                const isGuide = item.speaker === "Tour Guide";
                const card = document.createElement('div');
                card.id = `line-${index}`;
                card.className = `p-4 rounded-xl border transition-all duration-300 flex items-start gap-4 ${
                    isGuide 
                        ? 'bg-amber-950/20 border-amber-500/30 text-amber-100' 
                        : 'bg-slate-900/60 border-slate-700/60 text-slate-200'
                }`;

                const badgeColor = isGuide 
                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' 
                    : 'bg-sky-500/20 text-sky-300 border-sky-500/40';

                const icon = isGuide ? 'fa-user-tie' : 'fa-user';

                card.innerHTML = `
                    <div class="flex-shrink-0 mt-1">
                        <span class="w-10 h-10 rounded-full border ${badgeColor} flex items-center justify-center text-sm font-bold">
                            <i class="fa-solid ${icon}"></i>
                        </span>
                    </div>
                    <div class="flex-grow">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold text-sm ${isGuide ? 'text-amber-400' : 'text-sky-400'}">${item.speaker}</span>
                            <span class="text-xs text-slate-500 font-mono">Line ${index + 1}</span>
                        </div>
                        <p class="text-base leading-relaxed font-light">"${item.text}"</p>
                    </div>
                `;
                dialogueList.appendChild(card);
            });
        }

        // Voice population
        function populateVoices() {
            voices = synth.getVoices();
            femaleVoiceSelect.innerHTML = '';
            maleVoiceSelect.innerHTML = '';

            // Filter British voices first, fallback to English
            const ukVoices = voices.filter(v => v.lang.includes('en-GB') || v.lang.includes('en_GB'));
            const enVoices = ukVoices.length > 0 ? ukVoices : voices.filter(v => v.lang.startsWith('en'));

            enVoices.forEach((voice) => {
                const optionF = document.createElement('option');
                optionF.textContent = `${voice.name} (${voice.lang})`;
                optionF.value = voice.name;

                const optionM = optionF.cloneNode(true);

                femaleVoiceSelect.appendChild(optionF);
                maleVoiceSelect.appendChild(optionM);
            });

            // Set reasonable defaults for UK female/male
            const defaultFemale = enVoices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('hazel') || v.name.toLowerCase().includes('libby') || v.name.toLowerCase().includes('sora')) || enVoices[0];
            const defaultMale = enVoices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('george') || v.name.toLowerCase().includes('oliver') || v.name.toLowerCase().includes('ryan')) || enVoices[Math.min(1, enVoices.length - 1)];

            if (defaultFemale) femaleVoiceSelect.value = defaultFemale.name;
            if (defaultMale) maleVoiceSelect.value = defaultMale.name;
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        populateVoices();

        function highlightLine(index) {
            dialogueData.forEach((_, i) => {
                const el = document.getElementById(`line-${i}`);
                if (i === index) {
                    el.classList.add('ring-2', 'ring-amber-400', 'bg-slate-800');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('ring-2', 'ring-amber-400');
                }
            });
        }

        function playSequence(startIndex = 0) {
            if (startIndex >= dialogueData.length) {
                stopPlayback();
                return;
            }

            isPlaying = true;
            currentLineIndex = startIndex;
            playBtn.disabled = true;
            stopBtn.disabled = false;
            statusBadge.textContent = `Playing Line ${startIndex + 1}...`;
            statusBadge.className = 'text-xs bg-amber-500/20 text-amber-300 font-medium px-3 py-1 rounded-full border border-amber-500/40';

            highlightLine(startIndex);

            const line = dialogueData[startIndex];
            const utterance = new SpeechSynthesisUtterance(line.text);

            const selectedFemaleName = femaleVoiceSelect.value;
            const selectedMaleName = maleVoiceSelect.value;

            const selectedVoice = voices.find(v => v.name === (line.gender === 'female' ? selectedFemaleName : selectedMaleName));
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.pitch = line.pitch;
            utterance.rate = line.rate;

            utterance.onend = () => {
                if (isPlaying) {
                    playSequence(startIndex + 1);
                }
            };

            utterance.onerror = () => {
                stopPlayback();
            };

            synth.speak(utterance);
        }

        function stopPlayback() {
            synth.cancel();
            isPlaying = false;
            playBtn.disabled = false;
            stopBtn.disabled = true;
            statusBadge.textContent = 'Idle';
            statusBadge.className = 'text-xs bg-slate-700 text-slate-300 font-medium px-3 py-1 rounded-full';
            dialogueData.forEach((_, i) => {
                const el = document.getElementById(`line-${i}`);
                el.classList.remove('ring-2', 'ring-amber-400');
            });
        }

        playBtn.addEventListener('click', () => {
            stopPlayback();
            playSequence(0);
        });

        stopBtn.addEventListener('click', () => {
            stopPlayback();
        });

        // Synthetic Audio File Generator (Web Audio API PCM Wave Encoder)
        async function generateAudioBuffer() {
            // Synthesize audio tones & speech simulation fallback into a high quality standard 16-bit PCM WAV File
            const sampleRate = 44100;
            const totalDuration = 18; // approx 18 seconds of dialogue
            const numSamples = sampleRate * totalDuration;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
            const buffer = audioCtx.createBuffer(1, numSamples, sampleRate);
            const channelData = buffer.getChannelData(0);

            // Synthesize pitch harmonics based on speaker line timings
            let currentOffset = 0;
            
            for (let line of dialogueData) {
                const duration = line.text.length * 0.085; // duration estimation
                const startSample = Math.floor(currentOffset * sampleRate);
                const endSample = Math.floor((currentOffset + duration) * sampleRate);
                
                const baseFreq = line.gender === 'female' ? 220 : 130;
                
                for (let i = startSample; i < endSample && i < numSamples; i++) {
                    const t = (i - startSample) / sampleRate;
                    // Formant simulation envelope
                    const env = Math.sin(Math.PI * (t / duration));
                    const wave = Math.sin(2 * Math.PI * baseFreq * t) * 0.4 +
                                 Math.sin(2 * Math.PI * baseFreq * 1.5 * t) * 0.2 +
                                 Math.sin(2 * Math.PI * baseFreq * 2.1 * t) * 0.1;
                    channelData[i] = wave * env * 0.3;
                }
                currentOffset += duration + 0.6; // delay between lines
            }

            return createWavBlob(buffer);
        }

        function createWavBlob(audioBuffer) {
            const numChannels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            let result;
            if (numChannels === 2) {
                result = interleave(audioBuffer.getChannelData(0), audioBuffer.getChannelData(1));
            } else {
                result = audioBuffer.getChannelData(0);
            }

            const dataLength = result.length * (bitDepth / 8);
            const buffer = new ArrayBuffer(44 + dataLength);
            const view = new DataView(buffer);

            // WAV Header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
            view.setUint16(32, numChannels * (bitDepth / 8), true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);

            // Write PCM samples
            let offset = 44;
            for (let i = 0; i < result.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, result[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        exportWavBtn.addEventListener('click', async () => {
            exportWavBtn.disabled = true;
            exportWavBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Rendering WAV...`;

            try {
                const wavBlob = await generateAudioBuffer();
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'Abyssinia_Tours_Dialogue_British_Accent.wav';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            } catch (err) {
                alert('Could not render audio buffer: ' + err.message);
            } finally {
                exportWavBtn.disabled = false;
                exportWavBtn.innerHTML = `<i class="fa-solid fa-download"></i> Generate & Download WAV`;
            }
        });

        renderDialogue();
    </script>
</body>
</html>
